<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101113"><meta name="robots" content="noindex,nofollow"><title>دخول الأدمن | قصص وروايات صوتية</title><link rel="stylesheet" href="style.css"><meta name="google-adsense-account" content="ca-pub-8926612269781002">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8926612269781002"
     crossorigin="anonymous"></script>
</head><body><header class="topbar"><a class="brand" href="./"><img src="logo.png" alt="شعار قصص وروايات صوتية" style="width:42px;height:42px;object-fit:contain;vertical-align:middle;margin-left:8px"> <span>قصص وروايات صوتية</span></a><a class="back-home" href="./">← العودة للموقع</a></header><main class="login-page"><form id="adminLogin"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required placeholder="البريد الإلكتروني"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required placeholder="كلمة المرور"><button class="login-provider" type="submit">تسجيل الدخول</button></form><p id="loginMessage" class="login-note" role="status" hidden></p></main><script src="config.js"></script><script>document.getElementById('adminLogin').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('loginMessage');msg.hidden=false;msg.textContent='جارٍ التحقق…';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{const base=window.API_BASE||localStorage.getItem('qisas_api_base')||'';if(!base)throw Error('تعذر الاتصال بخادم الإدارة.');const r=await fetch(base.replace(/\/$/, '')+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.success)throw Error(data.error||'البريد الإلكتروني أو كلمة المرور غير صحيحة.');sessionStorage.setItem('qisas_admin_email',email);sessionStorage.setItem('qisas_admin_password',password);location.href='admin.html'}catch(err){msg.textContent=err.message||'تعذر تسجيل الدخول.'}});</script></body></html>
