<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101113">
  <meta name="description" content="قصصك الصوتية المفضلة في مكان واحد">
  <title>المفضلة | قصص وروايات صوتية</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    .favorites-page {
      max-width: 1100px;
      margin: 30px auto;
      padding: 16px;
      min-height: 60vh;
    }

    .favorites-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(212, 175, 55, .3);
    }

    .favorites-heart {
      color: #d4af37;
      font-size: 32px;
    }

    .favorites-heading h1 {
      margin: 0;
      font-size: 24px;
    }

    .favorites-subtitle {
      color: #aaa;
      margin-top: 8px;
      font-size: 14px;
    }

    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .favorite-card {
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, .25);
      border-radius: 14px;
      background: #181818;
      color: #f5f5f5;
    }

    .favorite-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #252525;
    }

    .favorite-card-content {
      padding: 14px;
    }

    .favorite-card h2 {
      font-size: 17px;
      margin: 0 0 10px;
    }

    .favorite-card p {
      color: #bbb;
      font-size: 14px;
      line-height: 1.8;
    }

    .favorite-date {
      color: #d4af37 !important;
      font-size: 13px !important;
    }

    .favorite-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .favorite-actions button,
    .favorite-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #d4af37;
      background: transparent;
      color: #e2c15a;
      font: inherit;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }

    .favorite-actions .open-story {
      background: #d4af37;
      color: #151515;
    }

    .favorites-empty {
      text-align: center;
      padding: 48px 16px;
      border: 1px dashed rgba(212, 175, 55, .4);
      border-radius: 14px;
      color: #ccc;
    }

    .favorites-empty .empty-heart {
      color: #d4af37;
      font-size: 44px;
    }

    .favorites-empty a {
      display: inline-block;
      margin-top: 16px;
      color: #e2c15a;
    }

    .favorites-status {
      color: #d4af37;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="الرئيسية">
      <img src="/logo.png" alt="شعار الموقع">
      <span>قصص وروايات صوتية</span>
    </a>
    <a href="/" class="back" style="text-decoration:none">الرئيسية</a>
  </header>

  <main class="favorites-page">
    <div class="favorites-heading">
      <span class="favorites-heart" aria-hidden="true">♥</span>
      <div>
        <h1>قصصي المفضلة</h1>
        <p class="favorites-subtitle">
          القصص التي حفظتها للعودة إليها في أي وقت
        </p>
      </div>
    </div>

    <p id="favoritesStatus" class="favorites-status" role="status"></p>

    <section
      id="favoritesGrid"
      class="favorites-grid"
      aria-label="القصص المفضلة">
    </section>

    <section id="favoritesEmpty" class="favorites-empty" hidden>
      <div class="empty-heart" aria-hidden="true">♡</div>
      <h2>لا توجد قصص في المفضلة بعد</h2>
      <p>أضف القصص التي تعجبك إلى المفضلة لتجدها هنا.</p>
      <a href="/">استكشف القصص</a>
    </section>
  </main>

  <footer>
    <a href="/">الرئيسية</a>
    <span> · </span>
    <a href="/about.html">عن الموقع</a>
    <span> · </span>
    <a href="/contact.html">اتصل بنا</a>
  </footer>

  <script src="/config.js"></script>
  <script src="/app.js"></script>

  <script>
    (() => {
      const grid = document.getElementById('favoritesGrid');
      const empty = document.getElementById('favoritesEmpty');
      const status = document.getElementById('favoritesStatus');

      // يجب أن يطابق المفتاح الموجود في app.js
      const KEY = 'qisas_favorites_v1';

      function readIds() {
        try {
          const value = JSON.parse(
            localStorage.getItem(KEY) || '[]'
          );

          return Array.isArray(value)
            ? [...new Set(value.map(String))]
            : [];
        } catch (_) {
          return [];
        }
      }

      function dateText(value) {
        if (!value) return 'تاريخ النشر غير متوفر';

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return 'تاريخ النشر غير متوفر';
        }

        return 'تاريخ النشر: ' +
          new Intl.DateTimeFormat('ar', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          }).format(date);
      }

      function getApiBase() {
        return (
          window.API_BASE ||
          localStorage.getItem('qisas_api_base') ||
          ''
        ).replace(/\/$/, '');
      }

      function imageUrl(story) {
        const path =
          story.image_path ||
          story.wide_image_path ||
          '';

        if (!path) return '/logo.png';

        if (/^https?:\/\//i.test(path)) {
          return path;
        }

        const base = getApiBase();

        return base
          ? base + '/media/' + path.replace(/^\/+/, '')
          : '/logo.png';
      }

      async function render() {
        grid.replaceChildren();
        status.textContent = '';

        const ids = readIds();

        if (!ids.length) {
          empty.hidden = false;
          return;
        }

        const base = getApiBase();

        if (!base) {
          empty.hidden = false;
          status.textContent =
            'تعذر تحديد عنوان الخادم. تحقق من إعدادات الموقع.';
          return;
        }

        try {
          const response = await fetch(
            base + '/api/catalog'
          );

          if (!response.ok) {
            throw new Error('تعذر تحميل القصص');
          }

          const data = await response.json();

          const stories = Array.isArray(data.stories)
            ? data.stories
            : [];

          const favorites = ids
            .map(id =>
              stories.find(
                story => String(story.id) === id
              )
            )
            .filter(Boolean);

          empty.hidden = favorites.length > 0;

          if (!favorites.length) {
            status.textContent =
              'لم يتم العثور على القصص المحفوظة. تحقق من اتصال الخادم.';
            return;
          }

          status.textContent =
            'عدد القصص المحفوظة: ' + favorites.length;

          favorites.forEach(story => {
            const card = document.createElement('article');
            card.className = 'favorite-card';

            const image = document.createElement('img');
            image.src = imageUrl(story);
            image.alt = story.title || 'قصة';
            image.loading = 'lazy';

            image.onerror = () => {
              image.onerror = null;
              image.src = '/logo.png';
            };

            const content = document.createElement('div');
            content.className = 'favorite-card-content';

            const title = document.createElement('h2');
            title.textContent = story.title || 'قصة';

            const desc = document.createElement('p');
            desc.textContent =
              String(story.description || '').slice(0, 140);

            const published = document.createElement('p');
            published.className = 'favorite-date';
            published.textContent = dateText(story.created_at);

            const actions = document.createElement('div');
            actions.className = 'favorite-actions';

            const open = document.createElement('a');
            open.className = 'open-story';
            open.href =
              '/story/' + encodeURIComponent(String(story.id));
            open.textContent = 'فتح القصة';

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.textContent = 'إزالة من المفضلة';

            remove.addEventListener('click', () => {
              const remaining = readIds().filter(
                id => id !== String(story.id)
              );

              localStorage.setItem(
                KEY,
                JSON.stringify(remaining)
              );

              render();
            });

            actions.append(open, remove);
            content.append(title, desc, published, actions);
            card.append(image, content);
            grid.append(card);
          });
        } catch (error) {
          empty.hidden = false;
          status.textContent =
            'تعذر تحميل القصص الآن. تحقق من الاتصال ثم أعد المحاولة.';
        }
      }

      render();

      window.addEventListener('storage', event => {
        if (event.key === KEY) render();
      });
    })();
  </script>
</body>
</html>
