<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101113">
  <meta name="description" content="صفحة القصص المفضلة في موقع قصص وروايات صوتية">
  <title>المفضلة | قصص وروايات صوتية</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .favorites-page {
      max-width: 1100px;
      margin: 30px auto;
      padding: 16px;
      min-height: 60vh;
    }

    .favorites-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(212, 175, 55, .3);
    }

    .favorites-heart {
      color: #d4af37;
      font-size: 32px;
    }

    .favorites-heading h1 {
      margin: 0;
      font-size: 24px;
    }

    .favorites-subtitle {
      color: #aaa;
      margin-top: 8px;
      font-size: 14px;
    }

    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .favorite-card {
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, .25);
      border-radius: 14px;
      background: #181818;
      color: #f5f5f5;
    }

    .favorite-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #252525;
    }

    .favorite-card-content {
      padding: 14px;
    }

    .favorite-card h2 {
      font-size: 17px;
      margin: 0 0 10px;
    }

    .favorite-card p {
      color: #bbb;
      font-size: 14px;
      line-height: 1.8;
    }

    .favorite-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .favorite-actions button,
    .favorite-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #d4af37;
      background: transparent;
      color: #e2c15a;
      font: inherit;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }

    .favorite-actions .open-story {
      background: #d4af37;
      color: #151515;
    }

    .favorites-empty {
      text-align: center;
      padding: 48px 16px;
      border: 1px dashed rgba(212, 175, 55, .4);
      border-radius: 14px;
      color: #ccc;
    }

    .favorites-empty .empty-heart {
      color: #d4af37;
      font-size: 44px;
    }

    .favorites-empty a {
      display: inline-block;
      margin-top: 16px;
      color: #e2c15a;
    }

    .favorites-status {
      color: #d4af37;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="الرئيسية">
      <img src="/logo.png" alt="شعار الموقع">
      <span>قصص وروايات صوتية</span>
    </a>
    <a href="/" class="back" style="text-decoration:none">الرئيسية</a>
  </header>

  <main class="favorites-page">
    <div class="favorites-heading">
      <span class="favorites-heart" aria-hidden="true">♥</span>
      <div>
        <h1>قصصي المفضلة</h1>
        <p class="favorites-subtitle">
          القصص التي حفظتها للعودة إليها في أي وقت
        </p>
      </div>
    </div>

    <p id="favoritesStatus" class="favorites-status" role="status"></p>

    <section id="favoritesGrid" class="favorites-grid"
      aria-label="القصص المفضلة"></section>

    <section id="favoritesEmpty" class="favorites-empty" hidden>
      <div class="empty-heart" aria-hidden="true">♡</div>
      <h2>لا توجد قصص في المفضلة بعد</h2>
      <p>أضف القصص التي تعجبك إلى المفضلة لتجدها هنا.</p>
      <a href="/">استكشف القصص</a>
    </section>
  </main>

  <footer>
    <a href="/">الرئيسية</a>
    <span> · </span>
    <a href="/about.html">عن الموقع</a>
    <span> · </span>
    <a href="/contact.html">اتصل بنا</a>
  </footer>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script>
    /*
      تعرض هذه الصفحة بيانات المفضلة المحفوظة محليًا.
      يجب مطابقة مفتاح التخزين وبنية بيانات القصة مع app.js
      قبل اعتماد الصفحة في الموقع.
    */
    (() => {
      const grid = document.getElementById('favoritesGrid');
      const empty = document.getElementById('favoritesEmpty');
      const status = document.getElementById('favoritesStatus');

      function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[ch]);
      }

      function readFavorites() {
        const keys = ['favorites', 'qisas_favorites', 'qisasFavorites'];

        for (const key of keys) {
          try {
            const value = localStorage.getItem(key);
            if (value === null) continue;

            const parsed = JSON.parse(value);
            if (Array.isArray(parsed)) return parsed;
            if (parsed && Array.isArray(parsed.favorites)) {
              return parsed.favorites;
            }
          } catch (_) {}
        }

        return [];
      }

      function render() {
        const favorites = readFavorites();
        grid.replaceChildren();

        if (!favorites.length) {
          empty.hidden = false;
          status.textContent = '';
          return;
        }

        empty.hidden = true;
        status.textContent = `عدد القصص المحفوظة: ${favorites.length}`;

        favorites.forEach(story => {
          if (!story || typeof story !== 'object') return;

          const title = story.title || story.name || 'قصة';
          const description = story.description || story.summary || '';
          const image = story.image || story.cover || story.thumbnail || '/logo.png';
          const id = story.id ?? story.slug ?? '';
          const link = story.url || story.href ||
            (id ? '/?story=' + encodeURIComponent(id) : '/');

          const card = document.createElement('article');
          card.className = 'favorite-card';

          const img = document.createElement('img');
          img.src = image;
          img.alt = title;
          img.loading = 'lazy';
          img.onerror = () => { img.onerror = null; img.src = '/logo.png'; };

          const content = document.createElement('div');
          content.className = 'favorite-card-content';

          const heading = document.createElement('h2');
          heading.textContent = title;

          const desc = document.createElement('p');
          desc.textContent = description.slice(0, 140);

          const actions = document.createElement('div');
          actions.className = 'favorite-actions';

          const open = document.createElement('a');
          open.className = 'open-story';
          open.href = link;
          open.textContent = 'فتح القصة';

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.textContent = 'إزالة من المفضلة';
          remove.addEventListener('click', () => {
            status.textContent =
              'لم تتم الإزالة تلقائيًا لتجنب تعديل تخزين الموقع بطريقة غير متوافقة.';
          });

          actions.append(open, remove);
          content.append(heading, desc, actions);
          card.append(img, content);
          grid.append(card);
        });
      }

      render();
    })();
  </script>
</body>
</html>
